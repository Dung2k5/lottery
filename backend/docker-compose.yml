version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: webxoso-postgres-dev
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: webxoso_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: webxoso-redis-dev
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
